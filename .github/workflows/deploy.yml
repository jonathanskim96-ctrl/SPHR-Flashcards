name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

# Per-branch group: a push elsewhere can never cancel the main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify # refuses to deploy if any check fails
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Audit M4: a value pasted into the wrong box stops the job here, before any step lists
      # the variables in the public run log. Expressions in `if:` are not printed.
      - name: Check the repository variables (their values are not printed)
        if: >-
          !startsWith(vars.VITE_SUPABASE_URL, 'https://') ||
          !endsWith(vars.VITE_SUPABASE_URL, '.supabase.co') ||
          !startsWith(vars.VITE_SUPABASE_PUBLISHABLE_KEY, 'sb_publishable_') ||
          !startsWith(vars.VITE_VAPID_PUBLIC_KEY, 'B')
        run: |
          echo "::error::A repository variable does not look right (VITE_SUPABASE_URL must be https://….supabase.co, VITE_SUPABASE_PUBLISHABLE_KEY must start with sb_publishable_, VITE_VAPID_PUBLIC_KEY must be the public key). Fix it in Settings > Secrets and variables > Actions > Variables (docs/SETUP.md Part A3). If a secret was pasted there, replace that secret too."
          exit 1
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
